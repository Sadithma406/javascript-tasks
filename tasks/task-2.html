<html>
<style>
  #fileInput{
    display:none
    }
   .fileUpload{
    display:inline-block;
    padding: 6px 12px;
    cursor: pointer;
    background-color: #62666b;
    color: white;
    border-radius: 4px;
    font-size: 14px;}

</style>  
<body>
  <label for="fileInput" class="fileUpload">Choose File</label>
  <input type="file" id="fileInput">
  <br><br>
  <div id="output"></div>
</body>

<script>
  const file = document.querySelector("#fileInput");
  const output = document.querySelector("#output");

  function printOutput(file) {
    if (file.length >0) {
      txt = "";
      for(f of file) {
        console.log("File Name: " + f.name); 
        txt += "File uploaded: " + f.name + "<br>";
      }
      output.innerHTML = txt;

    }
    else {
      return;
    }
  }
  //button click
  file.addEventListener("change", (event) => {
    const file = event.target.files;
    printOutput(file);
  })

  //pasting the file
  window.addEventListener("paste", (event) => {
    const file = event.clipboardData.files;
    printOutput(file);
  })

  //drag and drop
  const draggings = ["dragenter", "dragover", "dragleave", "drop"];
  draggings.forEach(eventName => {
    document.body.addEventListener(eventName, (event) => {
      event.preventDefault();
      event.stopPropagation();
    })
  })
  document.body.addEventListener("drop", (event) => {
    const file = event.dataTransfer.files;
    printOutput(file);
  })
</script>

</html>
