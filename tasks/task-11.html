<!DOCTYPE html>
<html>

<head>
  <style>

    .mainBox[data-theme="dark"] {
      --title-backgroundColor: #2c2c2c;
      --container-backgroundColor: #141414;
      --bar-backgroundColor: #818181;
      --topic-color: #e3e3e3;
      --pill-line-color: #444444;
      --leftRightBox-backgroundColor: #2c2c2c;
    }

    .mainBox[data-theme="light"] {
      --title-backgroundColor: #ffffff;
      --container-backgroundColor: #f4f6fb;
      --bar-backgroundColor: #e0e0e0;
      --topic-color: #333333;
      --pill-line-color: #cbd5e1;   
      --leftRightBox-backgroundColor: #ffffff;
     }


    body {
      background-color: #f4f6fb;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    .mainBox {
      width: 400px;
      margin: 20px auto;
      background-color:var(--title-backgroundColor); 
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }

    .mainBox-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background-color: var(--title-backgroundColor);
    }

    .mainBox-title h4 {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      color: var(--topic-color)
    }

    .content {
      padding: 24px;
      background-color: var(--container-backgroundColor);
      display: flex;
      flex-direction: column;
      gap: 20px; 
    }

    .searchbox {
      background-color:var(--leftRightBox-backgroundColor);
      padding: 14px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between; 
      align-items: center;
      color: #757575;
      font-size: 16px;
    }

    .searchIcon {
      width: 18px;
      height: 18px;
    }

    .mainBox-leftRight {
      display: flex;
      gap: 16px;
    }

    .leftBox,.rightBox {
      background-color:var(--leftRightBox-backgroundColor);
      padding: 20px;
      border-radius: 16px;
      flex: 1; 
      display: flex;
      flex-direction: column;
    }

    .dot-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pill-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }
    
    .leftBox .pill-dot { 
      background-color: #a855f7; 
    }  
    
    .rightBox .pill-dot { 
      background-color: #eab308; 
    } 

    .pill-line {
      height: 10px;
      border-radius: 5px;
      background-color: var(--pill-line-color);
    }
    
    .line-short { 
      width: 45px; 
    }
    
    .line-long { 
      width: 100%; 
      height: 10px; 
      margin-bottom: 10px; 
    }
    
    .line-long:last-child { 
      margin-bottom: 0; 
    } 

    .graph {
      display: flex;
      justify-content: space-between; 
      align-items: flex-end;
      padding-top: 10px;
    }

    .mainBox-bar {
      flex: 1;
      max-width: 24px;
      height: 100px; 
      border-radius: 6px;
      background: linear-gradient(to top, #3b9eff var(--h), var(--bar-backgroundColor) var(--h));
    }


    .toggle-switch {
    /* sizing */
    width: 55px;
    height: 26px;
    box-sizing: border-box;
    appearance: none;
    border-radius: 18px;
    display: flex;
    align-items: center;
    transition-property: background-color;
    transition-duration: 0.15s;
    background-color: #919191;
  }

  /* pseudo element for handle */
  .toggle-switch::before {
    content: "";
    display: inline-block;
    width: 30px;
    height: 30px;
    border-radius: 16px;
    background-color: #ffffff;
    transition-property: background-color, margin-left, transform;
    transition-duration: 0.15s;
  }

  .toggle-switch:checked::before {
    margin-left: calc(100% - 30px);
  }

  .toggle-switch:checked {
    background-color: #397de4;
  }
  </style>
</head>

<body>

  <div class="mainBox" data-theme="dark">
    <div class="mainBox-title">
      <h4 class="mainBox-topic">Dark mode</h4>
      <input type="checkbox" class="toggle-switch">
    </div>
    
    <div class="mainBox-container">
      <div class="content">
        
        <div class="searchbox">
          <span>Search...</span>
          <img src="./images/searchWhite.png" class="searchIcon">
        </div>
        
        <div class="mainBox-leftRight">
          <div class="leftBox">
            <div class="dot-row">
              <div class="pill-dot"></div>
              <div class="pill-line line-short"></div>
            </div>
            <div class="pill-line line-long"></div>
            <div class="pill-line line-long"></div>
            <div class="pill-line line-long"></div>
          </div>
          
          <div class="rightBox">
            <div class="dot-row">
              <div class="pill-dot"></div>
              <div class="pill-line line-short"></div>
            </div>
            <div class="pill-line line-long"></div>
            <div class="pill-line line-long"></div>
            <div class="pill-line line-long"></div>
          </div>
        </div>
        
        <div class="graph">
          <div class="mainBox-bar" style="--h: 12%;"></div>
          <div class="mainBox-bar" style="--h: 18%;"></div>
          <div class="mainBox-bar" style="--h: 32%;"></div>
          <div class="mainBox-bar" style="--h: 55%;"></div>
          <div class="mainBox-bar" style="--h: 75%;"></div>
          <div class="mainBox-bar" style="--h: 88%;"></div>
          <div class="mainBox-bar" style="--h: 80%;"></div>
          <div class="mainBox-bar" style="--h: 50%;"></div>
          <div class="mainBox-bar" style="--h: 35%;"></div>
        </div>
        
      </div>
    </div>
  </div>

</body>
<script>
  const toggleSwitch = document.querySelector('.toggle-switch');
  const mainBox = document.querySelector('.mainBox');
  const topicTex = document.querySelector(".mainBox-topic");

  toggleSwitch.addEventListener('change', () => {
    if (toggleSwitch.checked) {
      mainBox.setAttribute('data-theme', 'light');
      topicTex.innerText = "light mode";
    } else {
      mainBox.setAttribute('data-theme', 'dark');
      topicTex.innerText = "dark mode";
    }
  });
</script>

</html>
