<html>

<style>
  #container {
    width: 150px;
    height: 150px;
    border: 1px solid black;
    background-color: rgb(192, 192, 192);
    position: relative;
    padding: 2px;
  }

  .draggable {
    width: 25px;
    height: 25px;
    background-color: rgb(88, 88, 88);
    cursor: move;
    border: 1px solid black;
    position: absolute;
    margin: 1px;
    font-size: 10px;
    text-align: center;
    color: white;
    z-index: 1000;
    user-select: none;
  }

  .fixedImage img {
    width: 30px;
    height: 30px;
    padding: 2px 9px;
    opacity: 50%;
    border: 1px solid black;
  }

  #images {
    display: flex;
    bottom: 0px;
    position: absolute;
  }
</style>

<body>
  <h2>Drag the Names to the Correct Images</h2>
  <div id="container">
    <div id="drag1" class="draggable">Dog</div>
    <div id="drag2" class="draggable">Bird</div>
    <div id="drag3" class="draggable">Cat</div>

    <div id="images">
      <div id="bird" class="fixedImage"><img src="../images/bird.jpg"></div>
      <div id="cat" class="fixedImage"><img src="../images/cat.jpg"></div>
      <div id="dog" class="fixedImage"><img src="../images/dog.jpg"></div>
    </div>
  </div><br><br>
  <button onclick="check()">Check</button>
  <p id="result"></p>
</body>
<script>
  const smallBox = document.querySelectorAll(".draggable");
  const largeBox = document.querySelector("#container");
  const images = document.querySelectorAll(".fixedImage");

  let activeBox = null;
  let offsetX, offsetY;
  let startX = 0;
  window.addEventListener("load", () => {
    smallBox.forEach(box => {
      startX += box.clientWidth + 10;
      box.style.left = startX + "px";

    })
  })

  smallBox.forEach(box => {
    box.addEventListener("mousedown", (event) => {

      activeBox = box;

      offsetX = event.clientX - box.offsetLeft;
      offsetY = event.clientY - box.offsetTop;
    });
  });
  document.addEventListener("mousemove", (event) => {
    if (!activeBox) { return; }

    const x = event.clientX - offsetX;
    const y = event.clientY - offsetY;

    // Constrain the small box within the large box
    activeBox.style.left = Math.max(0, Math.min(x, largeBox.clientWidth - activeBox.clientWidth - 3)) + "px";
    activeBox.style.top = Math.max(0, Math.min(y, largeBox.clientHeight - activeBox.clientHeight - 3)) + "px";
  }
  );
  document.addEventListener("mouseup", () => {
    activeBox = null;
  });

  images.forEach(image => {
    image.addEventListener("mousedown", (event) => {
      event.preventDefault();
    })
  })

  function check() {
    let correct = true;
    for (let i = 0; i < smallBox.length; i++) {
      const box = smallBox[i];
      const image = document.getElementById(box.innerText.toLowerCase());
      if (!image) {
        correct = false;
        break;
      }
      const boxRect = box.getBoundingClientRect();
      const imageRect = image.getBoundingClientRect();

      if (boxRect.left > imageRect.right || boxRect.right < imageRect.left ||
        boxRect.bottom < imageRect.top || boxRect.top > imageRect.bottom) {
        correct = false;
        break;
      }

    }
    if (correct) {
      const txt = document.getElementById("result");
      txt.innerText = "Correct!";
      txt.style.color = "green";

    } else {
      const txt = document.getElementById("result");
      txt.innerText = "Incorrect. Try Again!";
      txt.style.color = "red";
    }
  }
</script>

</html>
