<html>

<head>
  <style>
    body[data-theme="light"] {
      --content-background-color: #e8e8e8;
      --content-color: black;
    }

    body[data-theme="dark"] {
      --content-background-color: #363636;
      --content-color: white;
    }

    .content {
      background-color: var(--content-background-color);
      color: var(--content-color);
    }

    .controls {
      display: flex;
      gap: 20px;
    }

    .toggleButton {
      width: 55px;
      height: 26px;
      box-sizing: border-box;
      appearance: none;
      border-radius: 18px;
      display: flex;
      align-items: center;
      transition-property: background-color;
      transition-duration: 0.15s;
      background-color: #919191;
      margin-top: 15px;
    }

    .toggleButton:before {
      content: "";
      display: inline-block;
      width: 30px;
      height: 30px;
      border-radius: 16px;
      background-color: #bebebe;
      transition-property: background-color, margin-left, transform;
      transition-duration: 0.15s;
    }

    .toggleButton:checked:before {
      margin-left: calc(100% - 30px);
    }

    .toggleButton:checked {
      background-color: #397de4;
    }
    .visualizer{
      display:flex;
      gap: 5px;
      align-items: end;
      margin-top: 20px;
      border:1px solid black;
      border-radius: 20px;
      box-sizing:border-box;
      padding:10px;
      background-color: blue;
      max-width:300px;
      width:100%;
      height:100px;
    }
    .bar{
      background-color: #949494;
      border-radius: 6px;
      flex-grow:1;
    }
  </style>
</head>

<body data-theme="light" class="content">
  <div class="controls">
    <h4 class="topic">Light View</h4>
    <input type="checkbox" class="toggleButton">
  </div>
  <audio controls class="audio" crossorigin="anonymous">
    <source src="./images/Aetheric.mp3" type="audio/mpeg">
  </audio>
  <div class="visualizer">
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
    <div class="bar" style="height: 0px"></div>
  </div>

  <script>
    const toggleButton = document.querySelector('.toggleButton');
    const topicText = document.querySelector(".topic");
    const audio = document.querySelector(".audio");
    const visualizer = document.querySelector(".visualizer");
    const bars = visualizer.querySelectorAll(".bar");


    toggleButton.addEventListener("change", () => {
      if (toggleButton.checked) {
        document.body.setAttribute("data-theme", "dark");
        topicText.innerText = "Dark View";
        audio.style.filter = "invert(1)";
      } else {
        document.body.setAttribute("data-theme", "light");
        topicText.innerText = "Light View";
        audio.style.filter = "invert(0)";
      }
    });

    const context = new AudioContext();
    const source =context.createMediaElementSource(audio);
    const analyser = context.createAnalyser();
    analyser.fftSize = 32;
    const length = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(length);
    source.connect(analyser);
    analyser.connect(context.destination);

    audio.addEventListener("play", () => {
      if (context.state === "suspended") {
        context.resume();
      }
    });
    setInterval(() => {
        analyser.getByteFrequencyData(dataArray);
        for (let i = 0; i < dataArray.length; i++) {
          const barHeight = dataArray[i] / 3;
          bars[i].style.height = barHeight + "px";
        }
      }, 15); 

  </script>
</body>



</html>
