<html>

<style>
  #container {
    width:150px;
    height: 150px;
    border: 1px solid black;
    background-color: rgb(192, 192, 192);
    position:relative;
    padding:2px;
  }
  .draggable {
    width: 20px;
    height: 20px;
    background-color: rgb(88, 88, 88);
    cursor: move;
    border:1px solid black;
    position:absolute;
    margin:1px;
  }

</style>
<body>
<div id="container">
  <div id="drag1" class="draggable"></div>
  <div id="drag2" class="draggable"></div>
  <div id="drag3" class="draggable"></div>
</div>
</body>
<script>
  const smallBox = document.querySelectorAll(".draggable");
  const largeBox = document.querySelector("#container");
  let activeBox = null;
  let offsetX, offsetY;
  let startX =0;
  window.addEventListener("load",()=>{
    smallBox.forEach(box=>{
      startX+=box.clientWidth+2;
      box.style.left = startX+"px";

    })
  })

  smallBox.forEach(box=>{
    box.addEventListener("mousedown",(event)=>{

      activeBox = box;

      offsetX = event.clientX - box.offsetLeft;
      offsetY = event.clientY - box.offsetTop;
  });
});
  document.addEventListener("mousemove", (event) => {
    if (!activeBox) { return; }

      const x = event.clientX - offsetX;
      const y = event.clientY - offsetY;

      // Constrain the small box within the large box
      activeBox.style.left = Math.max(0, Math.min(x, largeBox.clientWidth - activeBox.clientWidth-3)) + "px";
      activeBox.style.top = Math.max(0, Math.min(y, largeBox.clientHeight - activeBox.clientHeight-3)) + "px";
    }
);
  document.addEventListener("mouseup", () => {
    activeBox = null;
  });

</script>
</html>
