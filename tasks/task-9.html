<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: grey;
            font-family: sans-serif;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            margin: 40px;
        }

        canvas {
            cursor: crosshair;
            background-color: white;
            display: block;
        }

        /* Simple style for just the 4 corners */
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: black;
            z-index: 10;
        }

        /* Position the 4 corners precisely on the edges */
        .tl {
            top: -6px;
            left: -6px;
            cursor: nwse-resize;
        }

        .tr {
            top: -6px;
            right: -6px;
            cursor: nesw-resize;
        }

        .bl {
            bottom: -6px;
            left: -6px;
            cursor: nesw-resize;
        }

        .br {
            bottom: -6px;
            right: -6px;
            cursor: nwse-resize;
        }

        .controls {
            margin: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="controls">
        <input type="radio" name="mode" id="start" onclick="startRec()">
        <label for="start">Start Recording</label>
        <input type="radio" name="mode" id="stop" onclick="stopRec()">
        <label for="stop">Stop Recording</label>

        <input type="color" id="colorPicker">

        <label for="brushSize">Brush Size:</label>
        <input type="range" id="brushSize" min="1" max="50" value="5">
        <span id="sizeValue">5px</span>

        <button id="clear">Clear</button>
        <button id="erase">Erase</button>
    </div>

    <div class="canvas-container" id="container">
        <div class="resize-handle tl"></div>
        <div class="resize-handle tr"></div>
        <div class="resize-handle bl"></div>
        <div class="resize-handle br"></div>

        <canvas id="canvas" width="350" height="350"></canvas>
    </div>

    <script>
        const colorPicker = document.querySelector("#colorPicker");
        const clearButton = document.querySelector("#clear");
        const canvas = document.querySelector("#canvas");
        const container = document.querySelector("#container");
        const start = document.querySelector("#start");
        const stop = document.querySelector("#stop");
        const eraser = document.querySelector("#erase");
        const ctx = canvas.getContext("2d");

        const brushSize = document.querySelector("#brushSize");
        const sizeValue = document.querySelector("#sizeValue");

        let isDrawing = false;
        let isResizing = false;
        let isErasing = false;
        let lastX = 0; let lastY = 0;
        
        const chunks = [];
        const recorder = new MediaRecorder(canvas.captureStream(30), {mimeType: "video/webm"});
        recorder.ondataavailable =(event) =>{
            if(event.data.size>0){
                chunks.push(event.data);
            }
        }
        recorder.onstop = () =>{
            const blob = new Blob(chunks, {type: "video/webm"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "recording.webm";
            link.click();
        }

        function startRec(){
            chunks.length = 0;
            recorder.start();
        }
        function stopRec(){
            recorder.stop();
        }

        function applyBrushSettings() {
            ctx.lineJoin = "round";
            ctx.lineCap = "round";
            ctx.lineWidth = brushSize.value;
        }

        applyBrushSettings();

        colorPicker.addEventListener("click", () => {
            isErasing = false; 
            ctx.strokeStyle = colorPicker.value;
        });

        brushSize.addEventListener("input", () => {
            ctx.lineWidth = brushSize.value;
            sizeValue.innerText = `${brushSize.value}px`;
        });

        const handles = document.querySelectorAll(".resize-handle");

        handles.forEach(handle => {
            handle.addEventListener("mousedown", (event) => {
                event.preventDefault();
                isResizing = true;
            });
        });

        window.addEventListener("mousemove", (event) => {
            if (!isResizing) return;

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const rect = container.getBoundingClientRect();

            const newWidth = event.clientX - rect.left;
            const newHeight = event.clientY - rect.top;

            if (newWidth > 100 && newWidth < 800) canvas.width = newWidth;
            if (newHeight > 100 && newHeight < 600) canvas.height = newHeight;

            ctx.putImageData(imgData, 0, 0);
            applyBrushSettings();
        });

        window.addEventListener("mouseup", () => {
            isResizing = false;
        });

        // --- DRAWING LOGIC ---
        canvas.addEventListener("mousedown", (event) => {
            isDrawing = true;
            lastX = event.offsetX;
            lastY = event.offsetY;
        });

        canvas.addEventListener("mousemove", (event) => {
            if (!isDrawing || isResizing) return;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(event.offsetX, event.offsetY);
            if(!isErasing) {
                ctx.strokeStyle = colorPicker.value;
            }
            ctx.stroke();

            [lastX, lastY] = [event.offsetX, event.offsetY];
        });

        canvas.addEventListener("mouseup", () => isDrawing = false);
        canvas.addEventListener("mouseleave", () => isDrawing = false);

        clearButton.addEventListener("click", () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
        eraser.addEventListener("click",()=>{
            isErasing = true;
            ctx.strokeStyle = "white";

        })
    </script>
</body>

</html>
