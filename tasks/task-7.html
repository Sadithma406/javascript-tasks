<html>

<head>
  <style>
    #container {
      margin: auto;
      width: 400px;
      height: 450px;
      border: 1px solid black;
      background-color: rgb(192, 192, 192);
    }

    .cardCollection {
      padding: 15px;
    }

    .topics {
      display: flex;
      justify-content: space-around;
      margin: 20px;
      border: 1px solid blue;
      border-radius: 10px;
      padding: 10px;
    }

    .topics div {
      cursor: pointer;
      padding: 0px 10px;
    }

    .topics div:hover {
      color: blue;
      font-weight: bold;
    }

    .card {
      width: 70px;
      height: 80px;
      position: relative;
      transition: transform 0.5s;
      transform-style: preserve-3d;
      cursor: pointer;
      border-radius: 10px;
      display: inline-block;
      margin: 10px;
    }

    .sideview {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 10px;
      font-size: 30px;
      line-height: 80px;
      text-align: center;
    }

    .frontview {
      background-color: rgb(88, 88, 88);
    }

    .backview {
      background-color: rgb(88, 88, 88);
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>
  <h2>Match the Cards</h2>
  <div class="topics">
    <div id="nature">Nature</div>
    <div id="foodS">Foods</div>
    <div id="animals">Animals</div>
    <div id="dessert">Dessert</div>
  </div>
  <div id="container">
    <div class="cardCollection">
      <div class="card">
        <div class="frontview sideview"></div>
        <div class="backview sideview"></div>
      </div>
    </div>
  </div>

  <script>

    for (let i = 0; i < 15; i++) {
      const tile = document.createElement("div");
      tile.classList.add("card");
      tile.innerHTML = `
        <div class="frontview sideview"></div>
        <div class="backview sideview"></div>
      `;
      document.querySelector(".cardCollection").appendChild(tile);
    }

    const topics = document.querySelectorAll(".topics div");
    const emojis = {
      foods: ["🍔", "🥤", "🥗", "🍗", "🍟", "🥓", "🥞", "🍲"],
      nature: ["☘️", "🏕️", "🌿", "🌲", "🌳", "🌾", "🌴", "🍃"],
      animals: ["🐹", "🦊", "🦁", "🦓", "🐱", "🐶", "🐯", "🐼"],
      dessert: ["🍧", "🍨", "🧁", "🍰", "🍫", "🍩", "🍦", "🍹"]
    };
    let selectedEmoji = [];
    topics.forEach(topic => {
      topic.addEventListener("click", () => {
        //removing the current styles of the topics
        topics.forEach(t => {
          t.style.border = "none";
          t.style.borderRadius = "none";
        })
        //adding the new styles for the topic
        topic.style.border = "1px solid blue";
        topic.style.borderRadius = "10px";
        selectedEmoji = emojis[topic.innerText.toLowerCase()];
        const allEmojis = [...selectedEmoji, ...selectedEmoji];
        let cards = document.querySelectorAll(".card");
        let openCount = 0;
        let open1 = null;
        let open2 = null;
        //keep the original styles of the cards and remove the emojis
        cards.forEach(card => {
          card.style.transform = "rotateY(0deg)";
          card.querySelector(".backview").style.backgroundColor = "rgb(88, 88, 88)";
        });
        //Restructuring the cards to remove the previous event listeners
        const container = document.querySelector(".cardCollection");
        container.innerHTML = container.innerHTML;
        cards = document.querySelectorAll(".card");

        //shuffling the emojis 
        for (let i = 0; i < allEmojis.length; i++) {
          const randomIndex = Math.floor(Math.random() * allEmojis.length);
          [allEmojis[i], allEmojis[randomIndex]] = [allEmojis[randomIndex], allEmojis[i]];
        }
        //Assigning the shuffled emojis to the cards
        cards.forEach((card, index) => {
          card.querySelector(".backview").innerText = allEmojis[index];
          card.addEventListener("click", () => {
            if (openCount < 2 && card.style.transform != "rotateY(180deg)") {
              if (open1 == null) {
                open1 = card;
              }
              else if (open2 == null && card != open1) {
                open2 = card;
              }
              card.style.transform = "rotateY(180deg)";
              openCount++;
            }
            if (openCount == 2) {
              if (open1.querySelector(".backview").innerText == open2.querySelector(".backview").innerText) {
                setTimeout(() => {
                  open1.querySelector(".backview").style.backgroundColor = "yellow";
                  open2.querySelector(".backview").style.backgroundColor = "yellow";
                  open1 = null;
                  open2 = null;
                  openCount = 0;
                }, 300)

              }
              else {
                setTimeout(() => {
                  open1.style.transform = "rotateY(0deg)";
                  open2.style.transform = "rotateY(0deg)";
                  open1 = null;
                  open2 = null;
                  openCount = 0;
                }, 600)
              }
            }

          })
        })

      });
    });

  </script>
</body>

</html>
