<html>
    <body>
        <input type="file" id="fileInput">
        <br><br>
        <select id="size">
            <option value="0.2">x0.2</option>
            <option value="0.5">x0.5</option>
            <option value="1.5">x1.5</option>
            <option value="2">x2</option>   
        </select>
        <button id="download">Resize and Download</button>
    </body>

    <script>
        const file=document.querySelector("#fileInput");
        const size=document.querySelector("#size");
        const button=document.querySelector("#download");
        let img = null;
        let originalName = null;
        file.addEventListener("change",(event)=>{
            const chosenFile = event.target.files[0];
            if(chosenFile.type.startsWith("image/")){
                img = new Image();
                img.src = URL.createObjectURL(chosenFile);
                originalName = chosenFile.name;
            }
            else{
                alert("Please select an image file.");
            }
        });
        button.addEventListener("click",()=>{
            if(img){
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                canvas.width = img.width * parseFloat(size.value);
                canvas.height = img.height * parseFloat(size.value);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = "resized-"+originalName;
                    link.click();
                });
            }
            else{
                alert("Please select an image file.");
            }
        });
    </script>
</html>
