<html>
<style>
    #result {
      width: 75px;
      height: 25px;
      display: inline-block;
      border: 1px solid #000;
      box-sizing: border-box;
      vertical-align: middle;
    }
  </style>

<body>
  <div>
    <input type="color" id="color1" value="#ff0000"></input><span>+</span>
    <input type="color" id="color2" value="#00ff00"></input><span>+</span>
    <select id="mixingRatio">
      <option value="0">0%</option>
      <option value="0.25">25%</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
    <span>=</span>
    <div id="result"></div>
    <br><br>
    <button id="blend" value="Blend" onclick="blendColors()">Blend</button>
  </div>
</body>

<script>
    const color1 = document.querySelector("#color1");
    const color2 = document.querySelector("#color2");
    const ratio = document.querySelector("#mixingRatio");

    const toRGB = (color) => {
      const r = parseInt(color.substring(1, 3), 16);
      const g = parseInt(color.substring(3, 5), 16);
      const b = parseInt(color.substring(5, 7), 16);
      return { r, g, b };
    }
    function blendColors() {
      const rgb1 = toRGB(color1.value);
      const rgb2 = toRGB(color2.value);
      const r1 = rgb1.r;
      const g1 = rgb1.g;
      const b1 = rgb1.b;

      const r2 = rgb2.r;
      const g2 = rgb2.g;
      const b2 = rgb2.b;
      const r = Math.round(r1 * (1 - ratio.value) + r2 * ratio.value);
      const g = Math.round(g1 * (1 - ratio.value) + g2 * ratio.value);
      const b = Math.round(b1 * (1 - ratio.value) + b2 * ratio.value);

      const newColor = "#" + r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b.toString(16).padStart(2, '0');
      document.querySelector("#result").style.backgroundColor = newColor;
    }

  </script>

</html>
